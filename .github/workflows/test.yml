name: Test

on:
  pull_request:
    branches: [main]

# A new push to the same PR makes an in-flight run redundant.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  react:
    name: React unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # Never plain `yarn` here. .yarnrc points yarn-path at scripts/bootstrap.js,
      # which turns an argument-less run in the repo root into `yarn bootstrap` —
      # that installs the example app and then runs pod-install, which cannot work
      # on Linux. Passing arguments makes bootstrap.js forward to real yarn.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      # Gradle 7.6.4 and AGP 7.4.2 do not run on Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric fetches an android-all jar per SDK level on first run, which
      # dominates the job otherwise.
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/build.gradle') }}
          restore-keys: robolectric-${{ runner.os }}-

      # android/build.gradle resolves com.facebook.react:react-native from
      # node_modules/react-native/android, so the root install is required even
      # though this job runs no JavaScript.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: ./gradlew test
        working-directory: android

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/build/reports/tests/
          retention-days: 7
