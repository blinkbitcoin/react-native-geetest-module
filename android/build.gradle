buildscript {
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            classpath 'com.android.tools.build:gradle:7.4.2'
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    if (rootProject.ext.has(prop)) {
        return rootProject.ext.get(prop)
    }

    def unprefixedProp = prop.replaceFirst('GeetestModule_', '')
    rootProject.ext.has(unprefixedProp) ? rootProject.ext.get(unprefixedProp) : fallback
}

android {
    namespace 'com.reactnativegeetestmodule'
    compileSdkVersion safeExtGet('GeetestModule_compileSdkVersion', 34)
    buildToolsVersion safeExtGet('GeetestModule_buildToolsVersion', '34.0.0')
    defaultConfig {
        minSdkVersion safeExtGet('GeetestModule_minSdkVersion', 26)
        targetSdkVersion safeExtGet('GeetestModule_targetSdkVersion', 34)
        versionCode 1
        versionName "1.0"

    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lintOptions {
        disable 'GradleCompatible'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            // Required by Robolectric to resolve the merged manifest and resources
            includeAndroidResources = true
        }
    }
}

repositories {
    mavenLocal()
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url("$rootDir/../node_modules/react-native/android")
    }
    google()
    mavenCentral()
}

dependencies {
    if (project == rootProject) {
        // Standalone library tests do not apply React Native's Gradle plugin.
        implementation "com.facebook.react:react-native:+"
    } else {
        implementation "com.facebook.react:react-android"
    }
    implementation 'com.geetest.sensebot:sensebot:4.3.5.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
